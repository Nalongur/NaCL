[package]
name = "nacl-launcher-core"
version = "0.4.1"
description = "Core launcher services for Na Craft Launcher"
edition = "2021"

[lib]
name = "launcher_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rayon = "1"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
base64 = "0.22"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }
