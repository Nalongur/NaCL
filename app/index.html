<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaCL</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("nacl-theme");
        } catch {
          // Continue with the operating-system preference.
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --startup-background: #1a1e1f;
        --startup-text: #f2f6f6;
        --startup-muted: #929c9d;
        --startup-accent: #59d4d1;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --startup-background: #fbfdfc;
        --startup-text: #171b1c;
        --startup-muted: #697374;
        --startup-accent: #168f92;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--startup-background);
      }

      .startup-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--startup-background);
        color: var(--startup-text);
        font-family: "Segoe UI Variable", "Microsoft YaHei UI", "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 140ms ease-out;
      }

      .startup-splash--leaving {
        opacity: 0;
        pointer-events: none;
      }

      .startup-splash__content {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .startup-splash__icon {
        width: 112px;
        height: 112px;
        display: block;
      }

      .startup-splash__name {
        margin-top: 6px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.05em;
      }

      .startup-splash__status {
        color: var(--startup-muted);
        font-size: 13px;
      }

      .startup-splash__line {
        width: 44px;
        height: 2px;
        margin-top: 8px;
        background: var(--startup-accent);
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-splash {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="startup-splash" class="startup-splash" role="status" aria-live="polite">
      <div class="startup-splash__content">
        <img
          class="startup-splash__icon"
          src="/src/assets/brand/nacl-icon.svg"
          alt="NaCL"
          width="112"
          height="112"
        />
        <div class="startup-splash__name">Na Craft Launcher</div>
        <div class="startup-splash__status">正在读取配置与实例</div>
        <div class="startup-splash__line" aria-hidden="true"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
